[shorturls]
gh = "github:{path}"
nixpkgs = "https://channels.nixos.org/{path}/nixexprs.tar.xz"

[all_follow]
nixpkgs = ["nixpkgs", "nixpkgs-lib"]

[inputs.nixpkgs]
url = "nixpkgs:nixos-unstable"

[inputs.hjem]
url = "gh:feel-co/hjem"

[inputs.neovim-config]
url = "git+https://git.gay/sunworms/neovim-config"

[inputs.sops-nix]
url = "gh:Mic92/sops-nix"

[inputs.niri-nix]
url = "git+https://codeberg.org/BANanaD3V/niri-nix"

[inputs.noctalia]
url = "gh:noctalia-dev/noctalia"

[inputs.watt]
url = "gh:NotAShelf/watt"

[inputs.niri-float-sticky]
url = "gh:probeldev/niri-float-sticky"

[inputs.yazi-flavors]
url = "gh:yazi-rs/flavors"
type = "fetch"

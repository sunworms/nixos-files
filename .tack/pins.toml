[shorturls]
gh = "github:{path}"

[inputs.nixpkgs]
url = "gh:NixOS/nixpkgs/nixos-unstable"
type = "fetch"

[inputs.tack]
url = "gh:manic-systems/tack"
type = "fetch"

[inputs.preservation]
url = "gh:nix-community/preservation"
type = "fetch"

[inputs.hjem]
url = "gh:feel-co/hjem"
type = "fetch"

[inputs.agenix]
url = "gh:ryantm/agenix"
type = "fetch"

[inputs.niri-nix]
url = "git+https://codeberg.org/bananad3v/niri-nix"
type = "fetch"

[inputs.niri-float-sticky]
url = "gh:probeldev/niri-float-sticky"
type = "fetch"

[inputs.nix-index-database]
url = "gh:nix-community/nix-index-database"
type = "fetch"

[inputs.pcsx2]
url = "https://github.com/PCSX2/pcsx2/releases/download/{tag}/pcsx2-{tag}-linux-appimage-x64-Qt.AppImage"
type = "fixed"
unpack = "file"
tag = "v{version}"

[inputs.helium]
url = "https://github.com/imputnet/helium-linux/releases/download/{tag}/helium-{tag}-x86_64.AppImage"
type = "fixed"
unpack = "file"
tag = "{version}"

[inputs.mitos]
url = "https://github.com/mitos-editor/mitos/releases/download/{tag}/mitos-{tag}-x86_64-linux.tar.xz"
type = "fixed"
unpack = "tarball"
tag = "v{version}"

[inputs.eden]
url = "https://nightly.eden-emu.dev/v1791499301.67bada77f8/Eden-Linux-67bada77f8-amd64-gcc-standard.AppImage"
type = "fixed"
unpack = "file"

theme = "pywal"

[editor]
bufferline = "multiple"
line-number = "relative"
cursorline = true

[editor.workspace-trust]
level = "servers"
prompt = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.soft-wrap]
enable = true

[keys]

[keys.normal]
"C-m" = ':lsp-workspace-command tinymist.pinMain "%sh{realpath %{buffer_name}}"'
"C-p" = ':lsp-workspace-command tinymist.startDefaultPreview'
"A-p" = ':lsp-workspace-command tinymist.doKillPreview "default_preview"'
C-d = ":half-page-down-smooth"
C-u = ":half-page-up-smooth"
pageup = ":page-up-smooth"
pagedown = ":page-down-smooth"

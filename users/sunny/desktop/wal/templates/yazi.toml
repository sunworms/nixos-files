# : Manager [[[

[mgr]
cwd = {{ fg = "{foreground}" }}

# Find
find_keyword = {{ fg = "{color1}", bold = true, italic = true, underline = true }}
find_position = {{ fg = "{color1}", bold = true, italic = true }}

# Marker
marker_copied = {{ fg = "{color10}", bg = "{color10}" }}
marker_cut = {{ fg = "{color10}", bg = "{color10}" }}
marker_marked = {{ fg = "{color1}", bg = "{color1}" }}
marker_selected = {{ fg = "{color2}", bg = "{color2}" }}

# Count
count_copied = {{ fg = "{foreground}", bg = "{color10}" }}
count_cut = {{ fg = "{foreground}", bg = "{color10}" }}
count_selected = {{ fg = "{foreground}", bg = "{color2}" }}

# Border
border_style  = {{ fg = "{color4}" }}

# : ]]]


# : Status [[[

[status]
overall = {{ fg = "{color4}" }}
sep_left  = {{ open = "", close = "" }}
sep_right = {{ open = "", close = "" }}

# Progress
progress_label = {{ bold = true }}
progress_normal = {{ fg = "{color4}", bg = "{background}" }}
progress_error = {{ fg = "{color1}", bg = "{background}" }}

# Permissions
perm_type = {{ fg = "{color3}" }}
perm_write = {{ fg = "{color2}" }}
perm_exec = {{ fg = "{color1}" }}
perm_read = {{ fg = "{color10}" }}
perm_sep = {{ fg = "{color12}" }}

# : ]]]


# : Mode [[[

[mode]

normal_main = {{ bg = "{color4}", fg = "{foreground}", bold = true }}
normal_alt  = {{ bg = "{color8}", fg = "{color15}" }}

select_main = {{ bg = "{color3}", fg = "{foreground}", bold = true }}
select_alt  = {{ bg = "{color8}", fg = "{color15}" }}

unset_main = {{ bg = "{color2}", fg = "{foreground}", bold = true }}
unset_alt  = {{ bg = "{color8}", fg = "{color15}" }}

# : ]]]


# : Input [[[

[input]
border = {{ fg = "{color4}" }}
title = {{}}
value = {{ fg = "{foreground}" }}
selected = {{ reversed = true }}

# : ]]]


# : Tabs [[[

[tabs]
active = {{ fg = "{background}", bold = true, bg = "{color4}" }}
inactive = {{ fg = "{color3}", bg = "{background}" }}
sep_inner = {{ open = "", close = "" }}

# : ]]]


# : Completion [[[

[cmp]
border = {{ fg = "{color4}", bg = "{foreground}" }}

# : ]]]


# : Tasks [[[

[tasks]
border = {{ fg = "{color4}" }}
title = {{}}
hovered = {{ fg = "{color10}", underline = true }}

# : ]]]


# : Which [[[

[which]
cols = 3
mask = {{ bg = "{background}" }}
cand = {{ fg = "{color4}" }}
rest = {{ fg = "{foreground}" }}
desc = {{ fg = "{foreground}" }}
separator = " ▶ "
separator_style = {{ fg = "{foreground}" }}

# : ]]]

# : Spotter [[[

[spot]
border   = {{ fg = "{color4}" }}
title    = {{ fg = "{color4}" }}
tbl_col  = {{ fg = "{foreground}" }}
tbl_cell = {{ fg = "{foreground}", bg = "{background}" }}

# : ]]]


# : Help [[[

[help]
on = {{ fg = "{foreground}" }}
run = {{ fg = "{foreground}" }}
hovered = {{ reversed = true, bold = true }}
footer = {{ fg = "{foreground}", bg = "{color3}" }}

# : ]]]


# : Notify [[[

[notify]
title_info = {{ fg = "{color2}" }}
title_warn = {{ fg = "{color4}" }}
title_error = {{ fg = "{color1}" }}

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    {{ mime = "image/*", fg = "{color4}" }},

    # Media
    {{ mime = "{{audio,video}}/*", fg = "{color5}" }},

    # Archives
    {{ mime = "application/{{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}}", fg = "{color3}" }},

    # Documents
    {{ mime = "application/{{pdf,doc,rtf}}", fg = "{color2}" }},

    # Special files
    {{ mime = "*", is = "orphan", fg = "{foreground}", bg = "{color9}" }},
    {{ mime = "application/*exec*", fg = "{color1}" }},

    # Fallback
    {{ url = "*", fg = "{foreground}" }},
    {{ url = "*/", fg = "{color4}" }},
]

# : ]]]


# Vicinae pywal16 Theme Template

[meta]
version = 1
name = "pywal"
description = "Theme generated by pywal16"
variant = "dark"

# ============================================================================
# Core Colors
# ============================================================================

[colors.core]
accent = "{color4}"
accent_foreground = "{color0}"
background = "{background}"
foreground = "{foreground}"
secondary_background = "{color0}"
border = "{color8}"

# ============================================================================
# Window Borders
# ============================================================================

[colors.main_window]
border = "{color8}"

[colors.settings_window]
border = "{color7}"

# ============================================================================
# Accent Palette
# ============================================================================

[colors.accents]
blue = "{color4}"
green = "{color2}"
magenta = "{color5}"
orange = {{ name = "{color3}", lighter = 40 }}
red = "{color1}"
yellow = {{ name = "{color3}", lighter = 80 }}
cyan = {{ name = "{color4}", lighter = 50 }}
purple = "{color5}"

# ============================================================================
# Text System
# ============================================================================

[colors.text]
default = "{foreground}"
muted = "{color8}"
danger = "{color1}"
success = "{color2}"
placeholder = {{ name = "{color8}", opacity = 0.6 }}

[colors.text.selection]
background = "{color4}"
foreground = "{color0}"

[colors.text.links]
default = "{color4}"
visited = {{ name = "{color2}", darker = 20 }}

# ============================================================================
# Input Fields
# ============================================================================

[colors.input]
border = "{color8}"
border_focus = "{color4}"
border_error = "{color1}"

# ============================================================================
# Buttons
# ============================================================================

[colors.button.primary]
background = "{color0}"
foreground = "{foreground}"

[colors.button.primary.hover]
background = {{ name = "{color4}", darker = 250 }}
foreground = "{foreground}"

[colors.button.primary.focus]
outline = "{color4}"

# ============================================================================
# Lists
# ============================================================================

[colors.list.item.hover]
background = {{ name = "{color4}", darker = 300, opacity = 0.5 }}
foreground = "{foreground}"

[colors.list.item.selection]
background = {{ name = "{color4}", darker = 200, opacity = 0.7 }}
foreground = "{foreground}"
secondary_background = {{ name = "{color4}", darker = 200 }}
secondary_foreground = "{foreground}"

# ============================================================================
# Grid Items
# ============================================================================

[colors.grid.item]
background = "{color0}"

[colors.grid.item.hover]
outline = {{ name = "{color5}", opacity = 0.8 }}

[colors.grid.item.selection]
outline = {{ name = "{color4}" }}

# ============================================================================
# Scrollbars
# ============================================================================

[colors.scrollbars]
background = {{ name = "{color4}", opacity = 0.2 }}

# ============================================================================
# Loading States
# ============================================================================

[colors.loading]
bar = "{color4}"
spinner = "{color4}"

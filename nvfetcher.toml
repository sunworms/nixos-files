[nixpkgs]
src.cmd = "curl -s -o /dev/null -w '%{url_effective}' -L --range 0-0 https://channels.nixos.org/nixos-unstable/nixexprs.tar.zst | grep -oP 'nixos-\\K[^/]+(?=/nixexprs)'"
fetch.tarball = "https://releases.nixos.org/nixos/unstable/nixos-$ver/nixexprs.tar.zst"

[preservation]
src.git = "https://github.com/nix-community/preservation"
fetch.tarball = "https://github.com/nix-community/preservation/archive/$ver.tar.gz"

[hjem]
src.git = "https://github.com/feel-co/hjem"
fetch.tarball = "https://github.com/feel-co/hjem/archive/$ver.tar.gz"

[agenix]
src.git = "https://github.com/ryantm/agenix"
fetch.tarball = "https://github.com/ryantm/agenix/archive/$ver.tar.gz"

[niri-nix]
src.git = "https://codeberg.org/bananad3v/niri-nix"
fetch.tarball = "https://codeberg.org/bananad3v/niri-nix/archive/$ver.tar.gz"

[niri-float-sticky]
src.git = "https://github.com/probeldev/niri-float-sticky"
fetch.tarball = "https://github.com/probeldev/niri-float-sticky/archive/$ver.tar.gz"

[nix-index-database]
src.git = "https://github.com/nix-community/nix-index-database"
fetch.tarball = "https://github.com/nix-community/nix-index-database/archive/$ver.tar.gz"

[neovim-config]
src.git = "https://git.gay/sunworms/neovim-config"
fetch.tarball = "https://git.gay/sunworms/neovim-config/archive/$ver.tar.gz"

# binary packages
[pcsx2]
src.cmd = "curl -sL 'https://api.github.com/repos/PCSX2/pcsx2/releases?per_page=1' | grep -oP '\"tag_name\":\\s*\"\\K[^\"]+'"
src.prefix = "v"
fetch.url = "https://github.com/PCSX2/pcsx2/releases/download/v$ver/pcsx2-v$ver-linux-appimage-x64-Qt.AppImage"

[ryujinx]
src.cmd = "curl -sL 'https://git.ryujinx.app/api/v1/repos/Ryubing/Canary/releases/latest' | grep -oP '\"tag_name\":\\s*\"\\K[^\"]+'"
fetch.url = "https://git.ryujinx.app/Ryubing/Canary/releases/download/$ver/ryujinx-canary-$ver-x64.AppImage"

[helium]
src.github = "imputnet/helium-linux"
fetch.url = "https://github.com/imputnet/helium-linux/releases/download/$ver/helium-$ver-x86_64_linux.tar.xz"
